packages:
  - packages/*
  - playground
  - docs

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
overrides:
  # Hub and Devframe require this exact peer; the resolver retained 1.2.5.
  '@devframes/agentic': 1.2.6
  '@nuxt/devtools': 4.0.0
  docus>@nuxt/ui: 4.12.0
  '@nuxt/content': 3.14.0
  '@vue/compiler-sfc': 3.5.44
  h3@^1: 1.15.11
  vue: 3.5.44
patchedDependencies:
  docus@5.12.3: patches/docus@5.12.3.patch
